<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Autorización requerida</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1d24;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #ffffff;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.4;
    }
    input {
      width: 100%;
      padding: 9px 10px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 2px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .error {
      min-height: 18px;
      font-size: 12px;
      color: #fca5a5;
      margin-bottom: 10px;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-cancel {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-confirm {
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h3 id="title">Autorización</h3>
  <p id="message">Ingrese el PIN de seguridad:</p>
  <input id="pin-input" type="password" autocomplete="off" autofocus />
  <div class="error" id="error-msg"></div>
  <div class="actions">
    <button type="button" class="btn-cancel" id="cancel-btn">Cancelar</button>
    <button type="button" class="btn-confirm" id="confirm-btn">Confirmar</button>
  </div>

  <script>
    const titleEl = document.getElementById("title");
    const msgEl = document.getElementById("message");
    const pinInput = document.getElementById("pin-input");
    const errorEl = document.getElementById("error-msg");
    const cancelBtn = document.getElementById("cancel-btn");
    const confirmBtn = document.getElementById("confirm-btn");

    async function loadInit() {
      try {
        const meta = await window.leafPinDialog.init();
        if (meta?.title) titleEl.textContent = meta.title;
        if (meta?.message) msgEl.textContent = meta.message;
        if (meta?.confirmLabel) confirmBtn.textContent = meta.confirmLabel;
      } catch (err) {
        errorEl.textContent = "Error al inicializar el diálogo.";
      }
      pinInput.focus();
    }

    async function handleSubmit() {
      errorEl.textContent = "";
      confirmBtn.disabled = true;
      try {
        const res = await window.leafPinDialog.submit(pinInput.value);
        if (!res?.ok) {
          errorEl.textContent = res?.error || "PIN incorrecto.";
          pinInput.value = "";
          pinInput.focus();
        }
      } catch {
        errorEl.textContent = "No se pudo verificar el PIN.";
      } finally {
        confirmBtn.disabled = false;
      }
    }

    confirmBtn.addEventListener("click", handleSubmit);
    cancelBtn.addEventListener("click", () => window.leafPinDialog.cancel());
    pinInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSubmit();
      if (e.key === "Escape") window.leafPinDialog.cancel();
    });

    loadInit();
  </script>
</body>
</html>
